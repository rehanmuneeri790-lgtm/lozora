<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lozora Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:Arial;margin:0;background:#f6f6f6;color:#222}
    header{background:#111;color:white;padding:20px;text-align:center}
    h1{margin:0}
    .container{max-width:1000px;margin:auto;padding:20px}
    .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
    .card{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 10px #ddd}
    .card img{width:100%;height:200px;object-fit:cover;border-radius:10px}
    .price{font-size:20px;font-weight:bold}
    button{background:#111;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
    .whatsapp{background:#25D366;margin-top:8px;width:100%}
  </style>
</head>

<body>

<header>
  <h1>LOZORA</h1>
  <p>Home & Kitchen • Jewellery • Clothing</p>
</header>

<div class="container">
  <h2>Our Products</h2>
  <div id="products" class="products">
    Loading products...
  </div>
</div>

<script>
const SUPABASE_URL = https://aaubsrshbmydpehxivak.supabase.co/rest/v1/
const SUPABASE_KEY = sb_publishable_0lOXF45wVheQ53NLGXDT0Q_vMWZkS0F

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  const box = document.getElementById("products");

  if (error) {
    box.innerHTML = "<p>Products load nahi ho rahe.</p>";
    console.log(error);
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "<p>Abhi koi product available nahi hai.</p>";
    return;
  }

  box.innerHTML = data.map(product => `
    <div class="card">
      ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}">` : ""}
      <h3>${product.name || ""}</h3>
      <p>${product.description || ""}</p>
      <p class="price">₹${product.price || 0}</p>
      <p>Category: ${product.category || ""}</p>
      <button class="whatsapp"
        onclick="orderProduct('${encodeURIComponent(product.name || "")}','${product.price || 0}')">
        Order on WhatsApp
      </button>
    </div>
  `).join("");
}

function orderProduct(name, price) {
  const phone = "917905521349";
  const message = `Hello Lozora, I want to order ${decodeURIComponent(name)} for ₹${price}.`;
  window.open(
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
    "_blank"
  );
}

loadProducts();
</script>

</body>
</html>
